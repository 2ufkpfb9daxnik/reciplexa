[package]
name = "reciplexa-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Type checking slice for reciplexa surface forms"
publish = false

[features]
default = []
# Keyword-table document-surface typecheck for fixtures. Off in production builds.
interim-surface = []

[dependencies]
reciplexa-syntax = { workspace = true }
reciplexa-effect = { workspace = true }

[dev-dependencies]
reciplexa-syntax = { workspace = true }

[[test]]
name = "typecheck"
required-features = ["interim-surface"]
