[package]
name = "reciplexa-bind"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Binding, scope, and name resolution for reciplexa"
publish = false

[features]
default = []
# Treat interim graphics heads (`page`/`circle`/…) as surface keywords (fixture bind).
interim-surface = []

[dependencies]
reciplexa-identity = { workspace = true }
reciplexa-source = { workspace = true }
reciplexa-syntax = { workspace = true }
reciplexa-core = { workspace = true }

[dev-dependencies]
reciplexa-core = { workspace = true }
reciplexa-eval = { workspace = true }
reciplexa-identity = { workspace = true }
reciplexa-source = { workspace = true }
