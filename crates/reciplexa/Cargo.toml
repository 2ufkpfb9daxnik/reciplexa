[package]
name = "reciplexa"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI entry and shared .rpx compile pipeline"
publish = false

[lib]
name = "reciplexa"
path = "src/lib.rs"

[[bin]]
name = "reciplexa"
path = "src/main.rs"

[dependencies]
reciplexa-diagnostic = { workspace = true, features = ["syntax"] }
reciplexa-identity = { workspace = true }
reciplexa-source = { workspace = true }
reciplexa-syntax = { workspace = true }
reciplexa-bind = { workspace = true }
reciplexa-document = { workspace = true }
reciplexa-lower = { workspace = true }
reciplexa-macro = { workspace = true }
reciplexa-effect = { workspace = true }
reciplexa-pdf = { workspace = true }
reciplexa-svg = { workspace = true }
reciplexa-pptx = { workspace = true }
reciplexa-types = { workspace = true }
reciplexa-scene = { workspace = true }
reciplexa-visual-ir = { workspace = true }
reciplexa-backend = { workspace = true }
reciplexa-eval = { workspace = true }
reciplexa-package = { path = "../reciplexa-package" }
