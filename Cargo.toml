[workspace]
resolver = "2"
members = [
    "crates/reciplexa-source",
    "crates/reciplexa-identity",
    "crates/reciplexa-outcome",
    "crates/reciplexa-diagnostic",
    "crates/reciplexa-test",
    "crates/reciplexa-bind",
    "crates/reciplexa-core",
    "crates/reciplexa-eval",
    "crates/reciplexa-document",
    "crates/reciplexa-ir",
    "crates/reciplexa-runtime",
    "crates/reciplexa-mem",
    "crates/reciplexa-visual-ir",
    "crates/reciplexa-motion",
    "crates/reciplexa-raster",
    "crates/reciplexa-video",
    "crates/reciplexa-opt",
    "crates/reciplexa-harden",
    "crates/reciplexa-backend",
    "crates/reciplexa-gui-runtime",
    "crates/reciplexa-codec",
    "crates/reciplexa-package",
    "crates/reciplexa-native",
    "crates/reciplexa-syntax",
    "crates/reciplexa-scene",
    "crates/reciplexa-pdf",
    "crates/reciplexa-svg",
    "crates/reciplexa-pptx",
    "crates/reciplexa-lower",
    "crates/reciplexa-types",
    "crates/reciplexa-view",
    "crates/reciplexa-macro",
    "crates/reciplexa-effect",
    "crates/reciplexa",
    "crates/reciplexa-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kageokaraito/reciplexa"

[workspace.dependencies]
rowan = "0.16"
egui = "0.31"
eframe = "0.31"
rfd = "0.15"
subsetter = "0.2"
reciplexa-source = { path = "crates/reciplexa-source" }
reciplexa-identity = { path = "crates/reciplexa-identity" }
reciplexa-outcome = { path = "crates/reciplexa-outcome" }
reciplexa-diagnostic = { path = "crates/reciplexa-diagnostic" }
reciplexa-test = { path = "crates/reciplexa-test" }
reciplexa-bind = { path = "crates/reciplexa-bind" }
reciplexa-core = { path = "crates/reciplexa-core" }
reciplexa-eval = { path = "crates/reciplexa-eval" }
reciplexa-document = { path = "crates/reciplexa-document" }
reciplexa-ir = { path = "crates/reciplexa-ir" }
reciplexa-runtime = { path = "crates/reciplexa-runtime" }
reciplexa-mem = { path = "crates/reciplexa-mem" }
reciplexa-visual-ir = { path = "crates/reciplexa-visual-ir" }
reciplexa-motion = { path = "crates/reciplexa-motion" }
reciplexa-raster = { path = "crates/reciplexa-raster" }
reciplexa-video = { path = "crates/reciplexa-video" }
reciplexa-opt = { path = "crates/reciplexa-opt" }
reciplexa-harden = { path = "crates/reciplexa-harden" }
reciplexa-backend = { path = "crates/reciplexa-backend" }
reciplexa-gui-runtime = { path = "crates/reciplexa-gui-runtime" }
reciplexa-codec = { path = "crates/reciplexa-codec" }
reciplexa-package = { path = "crates/reciplexa-package" }
reciplexa-native = { path = "crates/reciplexa-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reciplexa-syntax = { path = "crates/reciplexa-syntax" }
reciplexa-scene = { path = "crates/reciplexa-scene" }
reciplexa-pdf = { path = "crates/reciplexa-pdf" }
reciplexa-svg = { path = "crates/reciplexa-svg" }
reciplexa-pptx = { path = "crates/reciplexa-pptx" }
reciplexa-lower = { path = "crates/reciplexa-lower" }
zip = "2.2"
reciplexa-types = { path = "crates/reciplexa-types" }
reciplexa-view = { path = "crates/reciplexa-view" }
reciplexa-macro = { path = "crates/reciplexa-macro" }
reciplexa-effect = { path = "crates/reciplexa-effect" }
